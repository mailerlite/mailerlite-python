---
remotes:
  - git_url: git@github.com:mailerlite/git-hooks.git
    ref: main
    configs:
      - branch-validation-config.yml

pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: ruff format .
    gitleaks:
      run: gitleaks git --pre-commit --redact --staged --verbose --no-banner
      fail_text: Staged changes contain a secret. Remove it; never commit and revert.
